description = """
An experimental deep-learning system for automated classification of brain MRI
images into four categories: No Tumor, Glioma, Meningioma, and Pituitary Tumor.

The project investigates the effectiveness of pretrained convolutional neural
network architectures using transfer learning, image augmentation, and
GPU-accelerated training for medical image classification.
"""

