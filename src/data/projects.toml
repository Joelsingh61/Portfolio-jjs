# ------------------------------------------------------------
# PROBLEM STATEMENT
# ------------------------------------------------------------

[projects.problem]
title = "The Problem"

description = """
Brain tumor identification from MRI scans requires detailed analysis of
medical images and can involve significant time and specialist expertise.

The project investigates the use of deep-learning based computer vision
methods to automatically classify brain MRI images into multiple categories.

The core challenge is to develop a model capable of learning discriminative
visual features from MRI images and accurately distinguishing between
different tumor categories while maintaining good generalization on unseen
test images.
"""

key_points = [
    "Manual MRI image analysis can be time-intensive.",
    "Different tumor types can exhibit visually similar characteristics.",
    "Deep CNNs require large amounts of representative training data.",
    "Medical-image datasets can contain significant visual variation.",
    "A reliable evaluation requires more than training accuracy alone."
]

